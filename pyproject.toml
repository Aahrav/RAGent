[project]
name = "ragent"
version = "0.1.0"
description = "Production-Grade RAG Assistant with Agentic Capabilities"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py311"]
